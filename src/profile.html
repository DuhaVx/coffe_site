<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВОЛНА — Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/assets/logo-volna.svg" type="image/svg+xml">
</head>
<body class="profile-page">
  <header class="topbar">
    <a href="/" class="logo-wrap" id="logoKnopka">
      <span class="logo-mark" aria-hidden="true">
        <svg class="logo-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40">
          <rect width="64" height="64" rx="8" fill="#1d1c1b"/>
          <path d="M8 42c6-4 10-4 16 0s10 4 16 0 10-4 16 0" fill="none" stroke="#c0693a" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M6 48c8-3 12-3 20 0s12 3 20 0 14-3 22 0" fill="none" stroke="#8a4f2e" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
          <path d="M32 12v8M28 16h8" stroke="#c0693a" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="32" cy="28" rx="11" ry="9" fill="#2a2826" stroke="#c0693a" stroke-width="2"/>
          <path d="M24 28c0-4 3.5-7 8-7s8 3 8 7" fill="#c0693a" opacity="0.35"/>
          <path d="M21 37h22c0 6-4.5 10-11 10s-11-4-11-10z" fill="#2a2826" stroke="#c0693a" stroke-width="2"/>
        </svg>
      </span>
      <span class="logo">ВОЛНА</span>
    </a>
    <nav class="nav">
      <a href="/">Главная</a>
      <a href="/#admin" class="hidden" id="navAdmin">Админ</a>
    </nav>
    <div class="topbar-actions">
      <a class="account-toggle account-toggle--in" id="headerAccount" href="/profile.html">Личный кабинет</a>
    </div>
  </header>

  <main class="profile-main">
    <section class="account-panel">
      <header class="account-head">
        <h1>Аккаунт</h1>
        <a href="/" class="account-close" aria-label="На главную">×</a>
      </header>

      <div class="account-section">
        <div class="account-profile-row">
          <div class="account-avatar" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/>
            </svg>
          </div>
          <div>
            <p class="account-display-name" id="accountDisplayName">—</p>
            <p class="account-login-hint">Вы вошли как <span id="accountLoginHint">—</span></p>
          </div>
        </div>

        <div class="account-row" data-field="lastName">
          <div class="account-row-text">
            <span class="account-label">Фамилия</span>
            <span class="account-value">Не указано</span>
          </div>
          <button type="button" class="account-edit-btn">Изменить</button>
        </div>
        <div class="account-row" data-field="firstName">
          <div class="account-row-text">
            <span class="account-label">Имя</span>
            <span class="account-value">Не указано</span>
          </div>
          <button type="button" class="account-edit-btn">Изменить</button>
        </div>
        <div class="account-row" data-field="middleName">
          <div class="account-row-text">
            <span class="account-label">Отчество</span>
            <span class="account-value">Не указано</span>
          </div>
          <button type="button" class="account-edit-btn">Изменить</button>
        </div>
        <div class="account-row" data-field="login">
          <div class="account-row-text">
            <span class="account-label">Имя пользователя</span>
            <span class="account-value">—</span>
          </div>
          <button type="button" class="account-edit-btn">Изменить</button>
        </div>
        <div class="account-row" data-field="phone">
          <div class="account-row-text">
            <span class="account-label">Телефон</span>
            <span class="account-value">Не указано</span>
          </div>
          <button type="button" class="account-edit-btn">Изменить</button>
        </div>
        <div class="account-row" data-field="email">
          <div class="account-row-text">
            <span class="account-label">Эл. почта</span>
            <span class="account-value">Не указано</span>
          </div>
          <button type="button" class="account-edit-btn">Изменить</button>
        </div>
      </div>

      <div class="account-section">
        <h2 class="account-section-title">Безопасность</h2>
        <div class="account-row" data-field="password">
          <div class="account-row-text">
            <span class="account-label">Пароль</span>
            <span class="account-value">••••••••</span>
          </div>
          <button type="button" class="account-edit-btn">Изменить</button>
        </div>
      </div>

      <div class="account-section">
        <h2 class="account-section-title">Система</h2>
        <div class="account-row">
          <div class="account-row-text">
            <span class="account-label">Сеанс</span>
            <span class="account-value account-value--muted">Выход из аккаунта на этом устройстве</span>
          </div>
          <button type="button" class="account-edit-btn" id="logoutBtn">Выйти</button>
        </div>
        <a href="/#admin" class="account-admin-link hidden" id="profileAdminLink">Админ-панель</a>
      </div>
    </section>
  </main>

  <div class="edit-modal hidden" id="editModal">
    <div class="edit-modal-box">
      <h3 id="editModalTitle">Изменить</h3>
      <form id="editModalForm">
        <input id="editModalInput" type="text" autocomplete="off">
        <p id="editModalMsg" class="auth-msg"></p>
        <div class="edit-modal-actions">
          <button type="button" class="account-edit-btn" id="editModalCancel">Отмена</button>
          <button type="submit" class="auth-submit">Сохранить</button>
        </div>
      </form>
      <button type="button" class="edit-modal-x" id="editModalClose" aria-label="Закрыть">×</button>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="profile.js"></script>
</body>
</html>
