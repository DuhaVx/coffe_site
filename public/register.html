<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВОЛНА — Регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="/assets/logo-volna.svg" type="image/svg+xml">
</head>
<body class="auth-page">
  <header class="topbar">
    <a href="/" class="logo-wrap" id="logoKnopka">
      <span class="logo-mark" aria-hidden="true">
        <svg class="logo-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40">
          <rect width="64" height="64" rx="8" fill="#1d1c1b"/>
          <path d="M8 42c6-4 10-4 16 0s10 4 16 0 10-4 16 0" fill="none" stroke="#c0693a" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M6 48c8-3 12-3 20 0s12 3 20 0 14-3 22 0" fill="none" stroke="#8a4f2e" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
          <path d="M32 12v8M28 16h8" stroke="#c0693a" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="32" cy="28" rx="11" ry="9" fill="#2a2826" stroke="#c0693a" stroke-width="2"/>
          <path d="M24 28c0-4 3.5-7 8-7s8 3 8 7" fill="#c0693a" opacity="0.35"/>
          <path d="M21 37h22c0 6-4.5 10-11 10s-11-4-11-10z" fill="#2a2826" stroke="#c0693a" stroke-width="2"/>
        </svg>
      </span>
      <span class="logo">ВОЛНА</span>
    </a>
    <nav class="nav">
      <a href="/">Главная</a>
    </nav>
    <div class="topbar-actions">
      <a class="account-toggle" id="headerAccount" href="/login.html">Вход</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1>Регистрация</h1>
      <p class="auth-lead">Создай аккаунт по логину и паролю</p>
      <form id="registerForm" class="auth-form" novalidate>
        <label class="field-label" for="regLogin">Логин</label>
        <input id="regLogin" name="login" type="text" autocomplete="username" required minlength="3" placeholder="Придумай логин">

        <label class="field-label" for="regPassword">Пароль</label>
        <input id="regPassword" name="password" type="password" autocomplete="new-password" required minlength="4" placeholder="Минимум 4 символа">

        <p id="registerMsg" class="auth-msg" aria-live="polite"></p>
        <button type="submit" class="auth-submit">Зарегистрироваться</button>
      </form>
      <p class="auth-switch">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg class="footer-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true">
          <rect width="64" height="64" rx="8" fill="#1d1c1b"/>
          <ellipse cx="32" cy="28" rx="11" ry="9" fill="#2a2826" stroke="#c0693a" stroke-width="2"/>
          <path d="M21 37h22c0 6-4.5 10-11 10s-11-4-11-10z" fill="#2a2826" stroke="#c0693a" stroke-width="2"/>
        </svg>
        <span>ВОЛНА</span>
      </div>
      <p class="footer-phrase" id="dayPhrase"></p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script>
    initSiteHeader({ activePage: "register" });

    const form = document.getElementById("registerForm");
    const msg = document.getElementById("registerMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const login = document.getElementById("regLogin").value.trim();
      const password = document.getElementById("regPassword").value;
      showAuthMessage(msg, "Отправка…", false);
      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if (!res.ok) {
          showAuthMessage(msg, data.error || "Ошибка регистрации", true);
          return;
        }
        showAuthMessage(msg, "Готово! Переходим в кабинет…", false);
        window.location.href = "/profile.html";
      } catch {
        showAuthMessage(msg, "Сервер недоступен. Запустите npm start", true);
      }
    });

    const phrases = ["Кофе — это язык, на котором говорит утро.", "Сначала глоток, потом разговор."];
    const phraseEl = document.getElementById("dayPhrase");
    if (phraseEl) phraseEl.textContent = phrases[Math.floor(Math.random() * phrases.length)];
  </script>
</body>
</html>
